function validateData(data){
if(data.schemaVersion!==1||!Array.isArray(data.projects)||!data.projects.length||!Number.isFinite(Date.parse(data.updatedAt)))throw Error("Datos no válidos");
const ids=new Set(),ranks=new Set();for(const p of data.projects){if(!Number.isInteger(p.priority)||p.priority<1||p.priority>data.projects.length||ranks.has(p.priority))throw Error("Prioridad no válida");ranks.add(p.priority);if(typeof p.id!=="string"||ids.has(p.id)||!["Arquitectura","Mantenimiento"].includes(p.area)||typeof p.name!=="string"||!(p.amount===null||Number.isFinite(p.amount)&&p.amount>=0)||!Array.isArray(p.docs))throw Error("Proyecto no válido");ids.add(p.id);for(const d of p.docs){if(typeof d.id!=="string"||!/^https:\/\/(drive|docs)\.google\.com\//.test(d.url))throw Error("Documento no válido")}}
return data.projects;
}
async function loadPublishedData(){
const urls=["https://raw.githubusercontent.com/cristo886-prog/aprobaciones-gerenciales-lilipink/main/data.json","./data.json"];
let lastError;for(const url of urls){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(url+"?t="+Date.now(),{cache:"no-store",signal:controller.signal});if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();validateData(data);if(new Date(data.updatedAt)<new Date(publishedAt))throw Error("Versión anterior");return data}catch(error){lastError=error}finally{clearTimeout(timer)}}throw lastError||Error("No disponible");
}

button.disabled=true;button.setAttribute("aria-busy","true");button.textContent="Actualizando…";status.textContent="Consultando la versión publicada…";status.dataset.state="loading";
try{const data=await loadPublishedData(),next=data.projects,changed=JSON.stringify(next)!==JSON.stringify(projects);projects=next;orderedProjects=orderProjects();publishedAt=data.updatedAt;render();if($("#detail").open){const id=location.hash.slice(1);if(projects.some(p=>p.id===id))openDetail(id);else $("#detail").close()}
const time=new Intl.DateTimeFormat("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"America/Bogota"}).format(new Date());
status.textContent=(changed?"Actualizado · "+projects.length+" proyectos":"Sin novedades")+" · Revisado "+time;status.title="Datos publicados: "+publishedDate(publishedAt);status.dataset.state="ok";
}catch(error){status.textContent="No se pudo conectar. Se conservan los datos. Intenta de nuevo.";status.dataset.state="error";}
finally{button.disabled=false;button.setAttribute("aria-busy","false");button.textContent="↻ Actualizar datos";}
}

document.addEventListener("click",ev=>{let n=ev.target.closest("[data-close]");if(n){$("#"+n.dataset.close).close();return}n=ev.target.closest("[data-quote]");if(n){quote(n.dataset.quote);return}n=ev.target.closest("[data-doc]");if(n){const [id,i]=n.dataset.doc.split(":");openDoc(projects.find(p=>p.id===id).docs[+i]);return}n=ev.target.closest("[data-area]");if(n){area=n.dataset.area;render();history.replaceState(null,"",area==="Mantenimiento"?"#mantenimiento":"#arquitectura");return}n=ev.target.closest("[data-detail]");if(n)openDetail(n.dataset.detail)});
$("#modal").addEventListener("close",()=>{$("#pdf").src="about:blank"});$("#detail").addEventListener("close",()=>{if(projects.some(p=>"#"+p.id===location.hash))history.replaceState(null,"",area==="Mantenimiento"?"#mantenimiento":"#arquitectura")});
function followHash(){if(location.hash==="#mantenimiento"||location.hash==="#arquitectura"){area=location.hash==="#mantenimiento"?"Mantenimiento":"Arquitectura";render();if($("#detail").open)$("#detail").close();return}const p=projects.find(p=>"#"+p.id===location.hash);if(p)openDetail(p.id)}
window.addEventListener("hashchange",followHash);render();followHash();
</script></body></html>
