const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n),plain=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let area="",search="",view="blocks",closingHash=false;
const blank="Sin comentarios.";
const maintenance=projects.filter(p=>p.area==="Mantenimiento");
const maintenanceGroup={id:"mantenimiento",name:"Mantenimiento · 7 tiendas",area:"Mantenimiento",amount:maintenance.reduce((s,p)=>s+p.amount,0),type:"Cubiertas de inmuebles propios",reason:"Solicitud de Legal para inmuebles propios.",comments:"Patprimo: correctivo. Otras 6 tiendas: preventivo.",legal:false,docs:maintenance.flatMap(p=>p.docs)};
const priorities=["p12","p13","p14","p3","p4","p15","p1","p2"];
const displayItems=[...priorities.map(id=>projects.find(p=>p.id===id)),maintenanceGroup];
function openMaintenance(){const p=maintenanceGroup;$("#detailTitle").textContent="Mantenimiento · 7 tiendas";$("#detailBody").innerHTML='<p class="area">INMUEBLES PROPIOS · CUBIERTAS</p><div class="detail-price">'+money(p.amount)+' <small style="font-size:12px;letter-spacing:0">COP en total</small></div><dl class="detail-facts"><div><dt>Ejecución común</dt><dd>Octubre–noviembre de 2026 · Días por definir</dd></div><div><dt>Instrucción común</dt><dd>Solicitud del área Legal para el mantenimiento de inmuebles propios.</dd></div></dl><p class="sub">Patprimo requiere mantenimiento correctivo; las otras seis tiendas, preventivo. Sin comentarios adicionales en la fuente.</p><div class="maint-list">'+maintenance.map(p=>'<article class="maint-row" data-detail="'+p.id+'"><div><button class="title" data-detail="'+p.id+'">'+e(p.name)+'</button><p class="sub">'+(p.id==="p5"?"Correctivo · impermeabilización":"Preventivo · cubiertas")+'</p></div><strong>'+money(p.amount)+'</strong><button class="quote" data-quote="'+p.id+'">PDF</button></article>').join("")+'</div><a class="support" target="_blank" rel="noopener" href="'+e(maintenance[0].support)+'">Ver instrucción de Legal</a>';if(!$("#detail").open)$("#detail").showModal();history.replaceState(null,"","#mantenimiento")}

function date(p){return p.milestone?p.dateLabel+" · 2026":"Oct.–nov. 2026 · día por definir"}
function summary(p){if(p.id==="mantenimiento")return p.reason;if(p.id==="p12")return "Entrega del local el 30 de octubre; requiere demolición de muros.";if(p.id==="p13")return "Iniciar el 24 de octubre para cumplir la temporada.";if(p.id==="p14")return "Iniciar el 26 de octubre para devolver la huella anterior.";if(p.area==="Mantenimiento")return "Solicitud de Legal para inmuebles propios.";return p.reason}
function scope(p){if(p.id==="mantenimiento")return p.type;if(p.id==="p5")return "Impermeabilización de cubierta con manto";if(p.area==="Mantenimiento")return "Mantenimiento preventivo de cubiertas";return p.type}
function cards(list){return list.map(p=>'<article class="project" data-detail="'+p.id+'"><div class="project-top"><span class="area '+(p.area==="Mantenimiento"?"maintenance":"")+'">'+e(p.area)+'</span><span class="number">'+(displayItems.indexOf(p)+1).toString().padStart(2,"0")+' / 09</span></div><h2><button class="title" data-detail="'+p.id+'">'+e(p.name)+'</button></h2><p class="scope">'+e(scope(p))+'</p><div class="price"><button data-detail="'+p.id+'" aria-label="Ver detalle de '+e(p.name)+'">'+money(p.amount)+'</button></div><dl class="facts"><div class="date"><dt>Ejecución</dt><dd>'+e(date(p))+'</dd></div><div><dt>Instrucción</dt><dd>'+e(summary(p))+'</dd></div><div class="'+(p.legal?"legal":"")+'"><dt>Comentarios</dt><dd class="'+(!p.comments?"muted":"")+'">'+e(p.comments||blank)+'</dd></div></dl><div class="card-bottom">'+(p.id==="mantenimiento"?'<button class="quote" data-detail="mantenimiento">Ver las 7 tiendas</button>':'<button class="quote" data-quote="'+p.id+'">'+(p.docs.length===1?"Cotización PDF":"Documentos ("+p.docs.length+")")+'</button>')+'<button class="detail-link" data-detail="'+p.id+'">Ver detalle ↗</button></div></article>').join("")}
function table(list){return '<div class="table-wrap"><table><colgroup><col style="width:17%"><col style="width:15%"><col style="width:10%"><col style="width:14%"><col style="width:20%"><col style="width:16%"><col style="width:8%"></colgroup><thead><tr><th scope="col">Tienda / proyecto</th><th scope="col">Intervención</th><th scope="col">Presupuesto COP</th><th scope="col">Ejecución · 2026</th><th scope="col">Instrucción</th><th scope="col">Comentarios</th><th scope="col">Cotización</th></tr></thead><tbody>'+list.map(p=>'<tr data-detail="'+p.id+'"><td><button class="title" data-detail="'+p.id+'">'+e(p.name)+'</button><span class="area">'+e(p.area)+'</span></td><td>'+e(scope(p))+'</td><td class="amount">'+money(p.amount)+'</td><td>'+e(date(p))+'</td><td>'+e(summary(p))+'</td><td class="'+(p.legal?"legal-text":!p.comments?"muted":"")+'">'+e(p.comments||blank)+'</td><td>'+(p.id==="mantenimiento"?'<button class="quote" data-detail="mantenimiento">7 tiendas</button>':'<button class="quote" data-quote="'+p.id+'">Ver PDF'+(p.docs.length>1?" ("+p.docs.length+")":"")+'</button>')+'</td></tr>').join("")+'</tbody></table></div>'}
function render(){const list=displayItems.filter(p=>(!area||p.area===area)&&plain((p.id==="mantenimiento"?maintenance.flatMap(x=>[x.name,x.type,x.reason,x.comments]):[p.name,p.type,p.reason,p.comments]).join(" ")).includes(plain(search)));$("#count").textContent=list.length+" de 9 bloques · "+money(list.reduce((s,p)=>s+p.amount,0))+" COP";$("#rows").className=view==="blocks"?"grid":"";$("#rows").innerHTML=list.length?(view==="blocks"?cards(list):table(list)):'<p class="empty">No hay proyectos con esos filtros.</p>';document.querySelectorAll("[data-area]").forEach(n=>n.setAttribute("aria-pressed",String(n.dataset.area===area)));document.querySelectorAll("[data-view]").forEach(n=>n.setAttribute("aria-pressed",String(n.dataset.view===view)))}
function openDetail(id){if(id==="mantenimiento"){openMaintenance();return}const p=projects.find(p=>p.id===id);if(!p)return;$("#detailTitle").textContent=p.name;$("#detailBody").innerHTML=(p.area==="Mantenimiento"?'<button class="back-maint" data-detail="mantenimiento">← Volver a las 7 tiendas</button>':"")+'<p class="area">'+e(p.area)+' · Pendiente en la fuente</p><p class="scope">'+e(p.originalName)+'</p><div class="detail-price">'+money(p.amount)+' <small style="font-size:12px;letter-spacing:0">COP</small></div><dl class="detail-facts"><div><dt>Intervención</dt><dd>'+e(p.type)+'</dd></div><div><dt>Fecha de ejecución</dt><dd>'+e(p.milestone?p.dateLabel+" de 2026":p.period+" · Día por definir")+'</dd></div><div><dt>Instrucción / por qué es urgente</dt><dd>'+e(p.reason)+'</dd></div><div class="'+(p.legal?"legal":"")+'"><dt>Comentarios'+(p.legal?" · Revisión Legal pendiente":"")+'</dt><dd>'+e(p.comments||"Sin comentarios adicionales.")+'</dd></div></dl><button class="primary" data-quote="'+p.id+'">'+(p.docs.length===1?"Ver cotización PDF":"Ver documentos y cotizaciones ("+p.docs.length+")")+'</button>'+(p.support?'<a class="support" href="'+e(p.support)+'" target="_blank" rel="noopener">Ver instrucción de Legal</a>':"")+(p.folder?'<a class="support" href="'+e(p.folder)+'" target="_blank" rel="noopener">Carpeta de documentos</a>':"");if(!$("#detail").open)$("#detail").showModal();if(location.hash!=="#"+id)history.replaceState(null,"","#"+id)}
function openDoc(d){$("#docs").hidden=true;$("#modalTitle").textContent=d.name;$("#pdf").hidden=false;$("#pdf").src="https://drive.google.com/file/d/"+encodeURIComponent(d.id)+"/preview";$("#pdfLink").hidden=false;$("#pdfLink").href=d.url}
function quote(id){if(id==="mantenimiento"){openMaintenance();return}const p=projects.find(p=>p.id===id);if(!p)return;$("#pdf").hidden=true;$("#pdfLink").hidden=true;$("#docs").hidden=false;$("#modalTitle").textContent=p.name;$("#docs").innerHTML=p.docs.map((d,i)=>'<button data-doc="'+p.id+':'+i+'">'+e(d.name)+'</button>').join("");$("#modal").showModal();if(p.docs.length===1)openDoc(p.docs[0])}
document.addEventListener("click",ev=>{let n=ev.target.closest("[data-close]");if(n){$("#"+n.dataset.close).close();return}n=ev.target.closest("[data-quote]");if(n){quote(n.dataset.quote);return}n=ev.target.closest("[data-doc]");if(n){const [id,i]=n.dataset.doc.split(":");openDoc(projects.find(p=>p.id===id).docs[+i]);return}n=ev.target.closest("[data-area]");if(n){area=n.dataset.area;render();return}n=ev.target.closest("[data-view]");if(n){view=n.dataset.view;render();return}n=ev.target.closest("[data-detail]");if(n)openDetail(n.dataset.detail)});
$("#search").addEventListener("input",ev=>{search=ev.target.value;render()});$("#modal").addEventListener("close",()=>{$("#pdf").src="about:blank"});$("#detail").addEventListener("close",()=>{if(location.hash==="#mantenimiento"||projects.some(p=>"#"+p.id===location.hash))history.replaceState(null,"","#resumen")});window.addEventListener("hashchange",()=>{if(location.hash==="#mantenimiento"){openMaintenance();return}const p=projects.find(p=>"#"+p.id===location.hash);if(p)openDetail(p.id);else if($("#detail").open)$("#detail").close()});
render();const initial=projects.find(p=>"#"+p.id===location.hash);if(location.hash==="#mantenimiento")openMaintenance();else if(initial)openDetail(initial.id);
</script></body></html>
