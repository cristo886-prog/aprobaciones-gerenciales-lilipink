function publishedDate(value){return new Intl.DateTimeFormat("es-CO",{dateStyle:"medium",timeStyle:"short",timeZone:"America/Bogota"}).format(new Date(value))}
function isApproved(p){return p.approvalStatus==="approved"}

function sectionHash(){return area==="Aprobados"?"#aprobados":area==="NoAprobados"?"#no-aprobados":area==="Mantenimiento"?"#mantenimiento":"#arquitectura"}
function updateTotals(){
const pending=projects.filter(isPending),approved=projects.filter(isApproved),rejected=projects.filter(isRejected),display=area==="Aprobados"?approved:area==="NoAprobados"?rejected:pending,known=display.reduce((s,p)=>s+(p.amount??0),0),missing=display.filter(p=>p.amount===null).length;
$("#dashboardTitle").textContent=area==="Aprobados"?"Presupuestos aprobados":area==="NoAprobados"?"Presupuestos no aprobados":"Presupuestos por aprobar";

$("#projectSummary").textContent=approved.length+" aprobados · "+rejected.length+" no aprobados · "+pending.length+" pendientes";
for(const category of ["Arquitectura","Mantenimiento","Aprobados","NoAprobados"]){const items=category==="Aprobados"?approved:category==="NoAprobados"?rejected:pending.filter(p=>p.area===category),amount=items.reduce((s,p)=>s+(p.amount??0),0),missing=items.filter(p=>p.amount===null).length;const node=$('[data-area="'+category+'"] .category-budget');node.innerHTML=money(amount)+' <small>COP · '+items.length+(category==="Mantenimiento"?" tiendas":" proyectos")+(missing?' · '+missing+' por definir':'')+'</small>'}
}
function validateData(data){
if(data.schemaVersion!==1||!Array.isArray(data.projects)||!data.projects.length||!Number.isFinite(Date.parse(data.updatedAt)))throw Error("Datos no válidos");
const ids=new Set(),ranks=new Set();for(const p of data.projects){if(!["approved","rejected","pending"].includes(p.approvalStatus))throw Error("Estado de aprobación no válido");if(!Number.isInteger(p.priority)||p.priority<1||p.priority>data.projects.length||ranks.has(p.priority))throw Error("Prioridad no válida");ranks.add(p.priority);if(typeof p.id!=="string"||ids.has(p.id)||!["Arquitectura","Mantenimiento"].includes(p.area)||typeof p.name!=="string"||!(p.amount===null||Number.isFinite(p.amount)&&p.amount>=0)||!Array.isArray(p.docs))throw Error("Proyecto no válido");ids.add(p.id);for(const d of p.docs){if(typeof d.id!=="string"||!/^https:\/\/(drive|docs)\.google\.com\//.test(d.url))throw Error("Documento no válido")}}

async function loadPublishedData(){
const urls=["https://raw.githubusercontent.com/cristo886-prog/aprobaciones-gerenciales-lilipink/main/data.json","./data.json"];
let lastError;for(const url of urls){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(url+"?t="+Date.now(),{cache:"no-store",signal:controller.signal});if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();validateData(data);if(new Date(data.updatedAt)<new Date(publishedAt))throw Error("Versión anterior");return data}catch(error){lastError=error}finally{clearTimeout(timer)}}throw lastError||Error("No disponible");
}
async function refreshData(){
const button=$("#refreshData"),status=$("#refreshStatus");if(button.disabled)return;
button.disabled=true;button.setAttribute("aria-busy","true");button.textContent="Actualizando…";status.textContent="Consultando la versión publicada…";status.dataset.state="loading";
try{const data=await loadPublishedData(),next=data.projects,changed=JSON.stringify(next)!==JSON.stringify(projects);projects=next;orderedProjects=orderProjects();publishedAt=data.updatedAt;render();if($("#detail").open){const id=location.hash.slice(1);if(projects.some(p=>p.id===id))openDetail(id);else $("#detail").close()}
const time=new Intl.DateTimeFormat("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"America/Bogota"}).format(new Date());
status.textContent=(changed?"Web actualizada · "+projects.length+" proyectos":"No hay nueva publicación")+" · Revisado "+time;status.title="Datos publicados: "+publishedDate(publishedAt);status.dataset.state="ok";
}catch(error){status.textContent="No se pudo conectar. Se conservan los datos. Intenta de nuevo.";status.dataset.state="error";}
finally{button.disabled=false;button.setAttribute("aria-busy","false");button.textContent="↻ Recargar web";}
}

const row=(label,value)=>'<div class="date"><dt>'+e(label)+'</dt><dd>'+e(value)+'</dd></div>';
if(p.executionDate)return row(detail?"Fecha de ejecución":"Ejecución",exactDate(p.executionDate));
if(p.startDate||p.deliveryDate||p.endDate){return row(detail?"Fecha de inicio":"Inicio",p.startDate?(p.startDateEnd?new Intl.DateTimeFormat("es-CO",{day:"numeric",timeZone:"UTC"}).format(new Date(p.startDate+"T12:00:00Z"))+"–"+exactDate(p.startDateEnd):exactDate(p.startDate)):"Por confirmar")+row(p.endDate?(detail?"Fecha de finalización":"Finalización"):(detail?"Fecha de entrega":"Entrega"),p.endDate?exactDate(p.endDate):p.deliveryDate?exactDate(p.deliveryDate):"Por confirmar")}
return row(detail?"Período previsto":"Ejecución",/día por definir/i.test(p.period)?p.period:p.period+" · Día por definir");
}

function cards(list){return list.map(p=>'<article class="project" data-detail="'+p.id+'"><div class="project-top"><span class="area '+(p.area==="Mantenimiento"?"maintenance":"")+'">'+e(p.area)+(isApproved(p)?' · Aprobado':isRejected(p)?' · No aprobado':p.executionStatus==='Ejecutado'?' · Ejecutado':'')+'</span><span class="number">'+'Prioridad '+String(p.priority).padStart(2,"0")+'</span></div><h2><button class="title" data-detail="'+p.id+'">'+e(p.name)+'</button></h2><p class="scope">'+e(scope(p))+'</p>'+(isPending(p)?'':'<p class="decision-note '+(isRejected(p)?'negative':'positive')+'">'+e(p.approvalNote)+'</p>')+'<div class="price"><button data-detail="'+p.id+'" aria-label="Ver detalle de '+e(p.name)+'">'+money(p.amount)+'</button></div>'+(p.amountNote?'<p class="sub" style="margin:0 0 8px">'+e(p.amountNote)+'</p>':'')+'<dl class="facts">'+dateFacts(p)+'<div><dt>Instrucción</dt><dd>'+e(summary(p))+'</dd></div><div class="'+(p.legal?"legal":"")+'"><dt>Comentarios</dt><dd class="'+(!p.comments?"muted":"")+'">'+e(p.comments||blank)+'</dd></div></dl><div class="card-bottom"><button class="quote" '+(p.docs.length?'data-quote="'+p.id+'"':'disabled')+'>'+(p.docs.length===0?"Cotización pendiente":p.docs.length===1?(p.docs[0].kind==="spreadsheet"?"Ver soporte":"Cotización PDF"):"Documentos ("+p.docs.length+")")+'</button><button class="detail-link" data-detail="'+p.id+'">Ver detalle ↗</button></div></article>').join("")}
