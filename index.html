function rows(){const filtered=projects.filter(p=>(!area||p.area===area)&&[p.name,p.type,p.reason].join(" ").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(search.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()));$("#rows").innerHTML=filtered.length?filtered.map(p=>'<article class="row"><button class="title" data-go="'+p.id+'"><span class="tag">'+e(p.area)+'</span><h2>'+e(p.name)+'</h2><p class="muted">'+e(p.type)+'</p><p class="value">'+money(p.amount)+'</p><p class="muted">'+e(p.dateLabel)+'</p></button><div class="actions"><button data-go="'+p.id+'">Ver ficha</button><button data-quote="'+p.id+'">Cotización PDF</button></div></article>').join(""):'<p>No hay proyectos con esos filtros.</p>';$("#count").textContent=filtered.length+" proyectos"}
function render(){const p=projects.find(x=>x.id===location.hash.slice(1));$("#projects").value=p?.id||"resumen";if(!p){$("#content").innerHTML='<section class="card"><span class="tag">OCTUBRE–NOVIEMBRE 2026</span><h1>Presupuestos por aprobar</h1><div class="amount">'+money(projects.reduce((s,x)=>s+x.amount,0))+'<small>COP</small></div><p class="muted">15 proyectos pendientes en la fuente</p><div class="areas"><div>Arquitectura<strong>'+money(210383454)+'</strong>8 proyectos</div><div>Mantenimiento<strong>'+money(12369716)+'</strong>7 proyectos</div></div></section><div class="filters"><input id="search" type="search" placeholder="Buscar proyecto" aria-label="Buscar proyecto"><select id="area" aria-label="Filtrar por área"><option value="">Todas las áreas</option><option>Arquitectura</option><option>Mantenimiento</option></select></div><p class="muted" id="count"></p><div id="rows"></div>';$("#area").value=area;$("#search").value=search;$("#area").onchange=ev=>{area=ev.target.value;rows()};$("#search").oninput=ev=>{search=ev.target.value;rows()};rows();return}
const i=projects.indexOf(p);$("#content").innerHTML='<article class="card"><span class="tag">'+e(p.area)+' · Pendiente en la fuente</span><h1>'+e(p.name)+'</h1><p class="muted">'+e(p.type)+'</p><div class="amount">'+money(p.amount)+'<small>COP</small></div><dl><div><dt>Fecha de ejecución</dt><dd>'+e(p.dateLabel)+' · 2026</dd></div><div><dt>Por qué es urgente</dt><dd>'+e(p.reason)+'</dd></div><div class="'+(p.legal?'legal':'')+'"><dt>Comentarios'+(p.legal?' · Revisión Legal pendiente':'')+'</dt><dd>'+e(p.comments||"Sin comentarios adicionales.")+'</dd></div></dl><button class="primary" data-quote="'+p.id+'">'+(p.docs.length===1?'Ver cotización PDF':'Ver documentos y cotizaciones ('+p.docs.length+')')+'</button>'+(p.support?'<a class="secondary" target="_blank" rel="noopener" href="'+e(p.support)+'">Ver solicitud de Legal</a>':"")+(p.folder?'<br><a class="secondary" target="_blank" rel="noopener" href="'+e(p.folder)+'">Abrir carpeta de documentos</a>':"")+'<div class="notice">Versión de consulta. Las decisiones no se registran desde esta página.</div></article><div class="pager"><button data-go="'+projects[(i+14)%15].id+'">Anterior</button><span>'+(i+1)+' / 15</span><button data-go="'+projects[(i+1)%15].id+'">Siguiente</button></div>'}
function openDoc(d){$("#docs").hidden=true;$("#modalTitle").textContent=d.name;$("#pdf").hidden=false;$("#pdf").src="https://drive.google.com/file/d/"+encodeURIComponent(d.id)+"/preview";$("#pdfLink").hidden=false;$("#pdfLink").href=d.url}
function quote(id){const p=projects.find(x=>x.id===id);$("#pdf").hidden=true;$("#pdfLink").hidden=true;$("#docs").hidden=false;$("#modalTitle").textContent=p.name;$("#docs").innerHTML=p.docs.map((d,i)=>'<button data-doc="'+p.id+':'+i+'">'+e(d.name)+'</button>').join("");$("#modal").showModal();if(p.docs.length===1)openDoc(p.docs[0])}
document.addEventListener("click",ev=>{const n=ev.target.closest("[data-go],[data-quote],[data-doc]");if(!n)return;if(n.dataset.go)go(n.dataset.go);if(n.dataset.quote)quote(n.dataset.quote);if(n.dataset.doc){const [id,i]=n.dataset.doc.split(":");openDoc(projects.find(x=>x.id===id).docs[+i])}});
$("#close").onclick=()=>$("#modal").close();$("#modal").addEventListener("close",()=>{$("#pdf").src="about:blank"});$("#projects").onchange=ev=>go(ev.target.value);window.addEventListener("hashchange",render);render();
</script></body></html>
